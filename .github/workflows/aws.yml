name: Deploy to Amazon S3

on:
  push:
    branches:
      - "main"

env:
  AWS_REGION: 'ap-northeast-1'
  AWS_OIDC_NAME: 'GithubDeploy_to_S3'
  AWS_S3_BUCKET: 'lens-s.com'
  SOURCE_DIR: 'dist'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        role-to-assume: arn:aws:iam::${{secrets.AWS_ACCOUNT_ID}}:role/${{env.AWS_OIDC_NAME}}
        aws-region: ${{env.AWS_REGION}}

    - name: Build(1) npm
      run: npm ci

    - name: BUild(2) nuxt
      run: npm run generate

    - name: Copy files to S3
      run: |
          aws s3 sync ${{env.SOURCE_DIR}} s3://${{env.AWS_S3_BUCKET}}/
    
